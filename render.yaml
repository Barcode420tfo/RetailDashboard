services:
  - type: web
    name: retail-dashboard-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: 'true'
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
